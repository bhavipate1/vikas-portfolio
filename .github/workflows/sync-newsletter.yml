name: Sync newsletter editions

on:
  schedule:
    # Daily, off the top-of-hour/half-hour to avoid piling onto GitHub's busiest minutes.
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run newsletter sync
        run: node scripts/sync-newsletter.mjs
